<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexacro API Inspector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --badge-get: #0284c7;
      --badge-post: #10b981;
      --status-ok: #22c55e;
      --status-err: #ef4444;
      --dep-badge: #8b5cf6;
      --code-bg: #0b1329;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      width: 500px;
      height: 550px;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header & Actions */
    header {
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.95);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-box h1 {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.2px;
      color: var(--text);
    }

    .counter-pill {
      background: #334155;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      cursor: pointer;
      border: none;
      outline: none;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-export {
      background-color: var(--accent);
      color: white;
    }

    .btn-export:hover {
      background-color: var(--accent-hover);
    }

    .btn-clear {
      background-color: #334155;
      color: #cbd5e1;
    }

    .btn-clear:hover {
      background-color: #475569;
      color: white;
    }

    .search-input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .search-input:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }

    /* Scrollable Request List */
    #apiList {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #apiList::-webkit-scrollbar {
      width: 6px;
    }

    #apiList::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    /* Empty State */
    .empty-state {
      margin: auto;
      text-align: center;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 40px 20px;
    }

    .empty-state svg {
      width: 48px;
      height: 48px;
      stroke: var(--text-muted);
    }

    /* API Card */
    .api-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s ease;
    }

    .api-card:hover {
      border-color: #475569;
    }

    .api-summary {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }

    .api-meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    .badge-post { background: rgba(16, 185, 129, 0.2); color: #34d399; }
    .badge-get { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }

    .status-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .status-2xx { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-err { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    .url-label {
      font-size: 12px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .api-meta-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .dep-count-badge {
      background: rgba(139, 92, 246, 0.2);
      color: #c084fc;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .time-label {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* Card Details Drawer */
    .api-details {
      display: none;
      border-top: 1px solid var(--card-border);
      background: #141f36;
      padding: 10px 12px;
    }

    .api-card.open .api-details {
      display: block;
    }

    /* Tabs inside Details */
    .tabs-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 8px;
      padding-bottom: 4px;
    }

    .tab-btn {
      background: none;
      color: var(--text-muted);
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .tab-btn.active {
      background: #1e293b;
      color: var(--text);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    pre.code-view {
      background: var(--code-bg);
      padding: 8px;
      border-radius: 6px;
      font-size: 11px;
      color: #e2e8f0;
      max-height: 180px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
      border: 1px solid #1e293b;
    }

    /* Dependencies Display Table */
    .dep-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
    }

    .dep-table th {
      text-align: left;
      padding: 4px 6px;
      color: var(--text-muted);
      border-bottom: 1px solid var(--card-border);
      font-weight: 600;
    }

    .dep-table td {
      padding: 5px 6px;
      border-bottom: 1px solid #1e293b;
      vertical-align: top;
    }

    .xpath-tag {
      font-family: monospace;
      color: #38bdf8;
      word-break: break-all;
    }

    .source-api-tag {
      color: #facc15;
      font-size: 10px;
      font-family: monospace;
    }

    .val-highlight {
      background: rgba(59, 130, 246, 0.2);
      color: #93c5fd;
      padding: 1px 4px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <div class="title-box">
        <h1>EMS Nexacro Interceptor</h1>
        <span id="trafficCount" class="counter-pill">0</span>
      </div>
      <div class="btn-group">
        <button id="btnExport" class="btn-export" title="Export full chained API sequence as JSON">
          <span>📥</span> Export JSON
        </button>
        <button id="btnClear" class="btn-clear" title="Clear captured history">
          <span>🗑️</span> Clear Logs
        </button>
      </div>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Filter by URL or HTTP method..." />
  </header>

  <div id="apiList">
    <!-- Populated dynamically via popup.js -->
  </div>

  <!-- Dependency Engine Script -->
  <script src="dependencyEngine.js"></script>
  <!-- Main Popup Script -->
  <script src="popup.js"></script>
</body>
</html>
